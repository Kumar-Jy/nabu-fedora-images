# 99-nabu.conf - dracut config for the Xiaomi Pad 5 (nabu, qcom/sm8150)
#
# The Hexagon blobs below MUST be in the initramfs. The DT starts the
# slpi/cdsp/adsp remoteprocs before root is mounted, so rootfs copies are not
# enough - and losing them takes audio, wifi and bluetooth together while
# display and touch keep working. `modem` starts after switch_root, which hid it.
#
# omit_modules drops other-SoC drivers: --no-hostonly otherwise drags in
# firmware for a dozen SoCs nabu does not have (x1e80100 alone was 28 MiB).

# Drop: other-SoC drivers. Keep *-sm8150, *-qcom-*, fastrpc, qrtr, msm_drm,
# wcd934x, ath10k_*, cfg80211, mac80211, hci_uart, btqca.
omit_modules="amlogic-gxl-crypto btnxpuart camcc-sa8775p camcc-sc7280 camcc-sc8280xp \
camcc-sdm845 camcc-x1e80100 dispcc0-sa8775p dispcc1-sa8775p \
dispcc-qcm2290 dispcc-sc7280 dispcc-sc8280xp dispcc-sm6115 dispcc-sm8750 \
dispcc-x1e80100 gcc-sc8280xp gcc-sm8350 gcc-sm8450 gcc-sm8550 \
gpucc-sa8775p gpucc-sc7280 gpucc-sc8280xp gpucc-sm6115 gpucc-sm8350 \
gpucc-sm8450 gpucc-sm8550 gpucc-sm8650 gpucc-x1e80100 hisi_hpre hisi_qm \
hisi_sec2 hisi-trng-v2 hisi_zip imx412 lpassaudiocc-sc7280 \
lpasscc-sc8280xp lpasscc-sdm845 lpasscorecc-sc7280 marvell mmcc-msm8994 \
mmcc-msm8996 mmcc-msm8998 mt6315-regulator mt6360_charger nxp-nci \
nxp-nci_i2c pcie-mediatek-gen3 pci-meson phy-qcom-qmp-pcie-msm8996 \
pinctrl-sc7280-lpass-lpi pinctrl-sc8280xp-lpass-lpi \
pinctrl-sm6115-lpass-lpi pinctrl-sm8350-lpass-lpi \
pinctrl-sm8450-lpass-lpi pinctrl-sm8650-lpass-lpi qnoc-msm8916 \
rc-ati-tv-wonder-hd-600 rc-ati-x10 rc-hisi-poplar rc-hisi-tv-demo \
snd-soc-imx-audmux snd-soc-msm8916-analog snd-soc-msm8916-digital \
snd-soc-mt6357 snd-soc-mt6358 snd-soc-sc8280xp snd-soc-sdm845 \
snd-soc-x1e80100 tcsrcc-sm8750 ti-ads1015 ti-sn65dsi83 ti-sn65dsi86 \
ti-tfp410 videocc-sa8775p videocc-sc7280"

# Hexagon DSP firmware, required in the initrd (see above).
install_items+=" \
    /usr/lib/firmware/qcom/sm8150/xiaomi/nabu/slpi_nb.mbn \
    /usr/lib/firmware/qcom/sm8150/xiaomi/nabu/cdsp.mbn \
    /usr/lib/firmware/qcom/sm8150/xiaomi/nabu/adsp.mbn \
    /usr/lib/firmware/qcom/sm8150/xiaomi/nabu/modem.mbn \
    /usr/lib/firmware/qcom/sm8150/xiaomi/nabu/venus.mbn \
    /usr/lib/firmware/qcom/sm8150/xiaomi/nabu/wlanmdsp.mbn \
    /usr/lib/firmware/qcom/sm8150/xiaomi/nabu/a640_zap.mbn"
