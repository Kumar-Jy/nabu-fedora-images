name: 1. Build Builder Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/Dockerfile'

permissions:
  packages: write

env:
  # Docker needs lowercase; GHCR resolves the owner case-insensitively.
  CONTAINER_IMAGE: ghcr.io/kumar-jy/fedora-nabu-builder:45

jobs:
  build_and_push_image:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push builder container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scripts/Dockerfile
          push: true
          tags: ${{ env.CONTAINER_IMAGE }}
          platforms: linux/arm64